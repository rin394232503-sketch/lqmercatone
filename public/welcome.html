<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>L&Qmercatone - Buon Natale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,#1a0a00 0%,#0d2818 25%,#0a1628 50%,#1a1510 75%,#151210 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Inter',-apple-system,sans-serif;
  position:relative;
}

/* Gold shimmer animation */
@keyframes shimmer{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes snowfall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0.3}}

/* Snow particles */
.snow{position:fixed;width:4px;height:4px;background:rgba(255,255,255,0.6);border-radius:50%;animation:snowfall linear infinite;pointer-events:none}

/* Star */
.star{position:fixed;animation:shimmer 3s ease-in-out infinite;pointer-events:none;color:rgba(201,169,110,0.4)}

/* Main content */
.welcome-content{
  text-align:center;z-index:10;
  animation:fadeInUp 1.5s ease-out;
  padding:0 40px;
}
.welcome-icon{font-size:64px;margin-bottom:24px;animation:pulse 2s ease-in-out infinite}
.welcome-title{
  font-size:28px;font-weight:300;color:#e8d5a3;
  letter-spacing:6px;margin-bottom:8px;
  text-shadow:0 0 30px rgba(201,169,110,0.3);
}
.welcome-sub{
  font-size:18px;font-weight:300;color:rgba(232,213,163,0.7);
  letter-spacing:3px;margin-bottom:8px;
}
.welcome-subzh{
  font-size:16px;font-weight:300;color:rgba(232,213,163,0.5);
  letter-spacing:4px;margin-bottom:40px;
}
.welcome-line{
  width:120px;height:1px;
  background:linear-gradient(90deg,transparent,#c9a96e,transparent);
  margin:0 auto 40px;
}

/* Enter button */
.enter-btn{
  display:inline-block;
  padding:14px 48px;
  border:1px solid rgba(201,169,110,0.4);
  border-radius:40px;
  color:#e8d5a3;
  font-size:14px;
  font-weight:400;
  letter-spacing:4px;
  text-decoration:none;
  background:rgba(201,169,110,0.08);
  backdrop-filter:blur(10px);
  transition:all 0.4s;
  animation:fadeInUp 2s ease-out 0.5s both;
  cursor:pointer;
}
.enter-btn:hover,.enter-btn:active{
  background:rgba(201,169,110,0.2);
  border-color:rgba(201,169,110,0.6);
  box-shadow:0 0 30px rgba(201,169,110,0.15);
}

/* Bottom ornament */
.bottom-ornament{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(201,169,110,0.3);letter-spacing:3px;
  animation:fadeInUp 2s ease-out 1s both;
}
</style>
</head>
<body>

<!-- Snow -->
<div id="snowContainer"></div>

<!-- Stars -->
<div class="star" style="top:10%;left:15%;font-size:12px;animation-delay:0s">✦</div>
<div class="star" style="top:20%;right:20%;font-size:10px;animation-delay:1s">✧</div>
<div class="star" style="top:60%;left:10%;font-size:14px;animation-delay:0.5s">✦</div>
<div class="star" style="top:70%;right:15%;font-size:10px;animation-delay:1.5s">✧</div>
<div class="star" style="top:40%;left:80%;font-size:12px;animation-delay:2s">✦</div>

<!-- Content -->
<div class="welcome-content">
  <div class="welcome-icon">🎄</div>
  <div class="welcome-title">BUON NATALE</div>
  <div class="welcome-line"></div>
  <div class="welcome-sub">祝你圣诞节快乐</div>
  <div class="welcome-subzh">L&Qmercatone</div>
  <a href="index.html" class="enter-btn">进 入 商 城</a>
</div>

<div class="bottom-ornament"> ✦ ✦</div>

<script>
// Generate snow
(function(){
  const c=document.getElementById('snowContainer');
  for(let i=0;i<40;i++){
    const s=document.createElement('div');
    s.className='snow';
    s.style.left=Math.random()*100+'%';
    s.style.width=s.style.height=(Math.random()*3+1)+'px';
    s.style.animationDuration=(Math.random()*8+6)+'s';
    s.style.animationDelay=Math.random()*10+'s';
    s.style.background=Math.random()>0.5?'rgba(255,255,255,0.5)':'rgba(232,213,163,0.4)';
    c.appendChild(s);
  }
})();

// Auto-enter after 8 seconds
setTimeout(()=>{location.href='index.html'},8000);
</script>
</body>
</html>
