<!-- L&Q Mercatone Logo - Transparent Background Version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E6A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- L&Q Monogram Circle -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#goldGrad3)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="url(#goldGrad3)" stroke-width="0.5" opacity="0.4"/>

  <!-- L letter -->
  <text x="35" y="75" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="url(#goldGrad3)">L</text>

  <!-- & symbol -->
  <text x="55" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad3)" opacity="0.8">&amp;</text>

  <!-- Q letter -->
  <text x="66" y="75" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="url(#goldGrad3)">Q</text>

  <!-- Brand Name -->
  <text x="115" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#1a1a2e" letter-spacing="3">L&amp;Q</text>
  <text x="115" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#A8862D" letter-spacing="5">MERCATONE</text>

  <!-- Decorative line -->
  <line x1="115" y1="86" x2="340" y2="86" stroke="url(#goldGrad3)" stroke-width="0.8" opacity="0.6"/>

  <!-- Tagline -->
  <text x="115" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#8B7D3C" letter-spacing="2" font-style="italic">La tua bottega italiana</text>
</svg>
