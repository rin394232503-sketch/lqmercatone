<!-- L&Q Mercatone Icon - Square Version (Favicon/App Icon) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F5E6A3;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#F5E6A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8862D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="240" r="175" fill="none" stroke="url(#goldGrad2)" stroke-width="5" filter="url(#glow)"/>

  <!-- Inner ring -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" opacity="0.4"/>

  <!-- L letter -->
  <text x="155" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="160" font-weight="bold" fill="url(#goldGrad2)">L</text>

  <!-- & symbol -->
  <text x="235" y="265" font-family="Georgia, 'Times New Roman', serif" font-size="75" fill="url(#goldGrad2)" opacity="0.85">&amp;</text>

  <!-- Q letter -->
  <text x="285" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="160" font-weight="bold" fill="url(#goldGrad2)">Q</text>

  <!-- Bottom text: MERCATONE -->
  <text x="256" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#C9A84C" text-anchor="middle" letter-spacing="12">MERCATONE</text>

  <!-- Decorative line under text -->
  <line x1="130" y1="445" x2="382" y2="445" stroke="url(#goldGrad2)" stroke-width="1.5" opacity="0.5"/>

  <!-- Small decorative elements -->
  <text x="115" y="445" font-size="14" fill="url(#goldGrad2)" opacity="0.4">✦</text>
  <text x="390" y="445" font-size="14" fill="url(#goldGrad2)" opacity="0.4">✦</text>
</svg>
