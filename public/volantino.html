<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>L&Qmercatone - Volantino Offerte</title>
<style>
.lang-switch{position:fixed;top:12px;right:16px;z-index:200;padding:6px 14px;border-radius:16px;
  background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border:1px solid #e0e0e0;
  font-size:12px;color:#666;cursor:pointer;font-weight:500}
.lang-switch:active{opacity:0.7}
[data-lang-zh]{display:none}
body.lang-zh [data-lang-it]{display:none}
body.lang-zh [data-lang-zh]{display:block}

/* ===== Responsive ===== */
@media(max-width:768px){body{max-width:100%}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#ffffff;--bg-soft:#f8f9fa;--text:#2d3436;--text-light:#636e72;--text-muted:#b2bec3;--accent:#6c5ce7;--accent-bg:#f0eeff;--border:#e9ecef;--border-light:#f1f3f5;--danger:#e17055;--success:#00b894;--radius:12px}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg-soft);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh}

/* Top Nav */
.top-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-light)}
.back-btn{font-size:20px;color:var(--text)}
.top-nav-title{flex:1;font-size:16px;font-weight:600;text-align:center}
.top-nav-actions{display:flex;gap:8px}
.top-nav-actions button{font-size:18px}

/* Christmas garland */
.xmas-garland{position:fixed;top:0;left:0;right:0;height:6px;z-index:200;display:flex;overflow:hidden;pointer-events:none}
.xmas-garland span{flex:1;height:6px}
.xmas-garland span:nth-child(odd){background:#c0392b}
.xmas-garland span:nth-child(even){background:#27ae60}

/* Flyer Header */
.flyer-header{background:linear-gradient(135deg,#c0392b,#e74c3c);color:white;text-align:center;padding:24px 20px 20px;position:relative;overflow:hidden}
.flyer-header::before{content:'🎄';position:absolute;top:10px;left:16px;font-size:24px;animation:swing 3s ease-in-out infinite}
.flyer-header::after{content:'🎅';position:absolute;top:10px;right:16px;font-size:24px;animation:swing 3s ease-in-out infinite reverse}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.flyer-header h1{font-size:24px;font-weight:700;margin-bottom:4px}
.flyer-header p{font-size:14px;opacity:0.9}
.flyer-header .validity{font-size:12px;opacity:0.7;margin-top:8px;background:rgba(255,255,255,0.15);display:inline-block;padding:4px 14px;border-radius:20px}

/* Flyer Image */
.flyer-container{padding:16px}
.flyer-image-wrapper{background:white;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.08);border:1px solid var(--border-light)}
.flyer-image-wrapper img{width:100%;display:block}
.flyer-image-wrapper .flyer-placeholder{padding:60px 20px;text-align:center;color:var(--text-muted)}
.flyer-image-wrapper .flyer-placeholder .fp-icon{font-size:48px;margin-bottom:12px}
.flyer-image-wrapper .flyer-placeholder p{font-size:14px;line-height:1.6}

/* Promo Grid (alternative to image) */
.promo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.promo-card{background:white;border-radius:var(--radius);padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid var(--border-light);position:relative;overflow:hidden}
.promo-card .promo-discount{position:absolute;top:0;right:0;background:var(--danger);color:white;font-size:11px;font-weight:700;padding:4px 10px;border-radius:0 0 0 10px}
.promo-card .promo-emoji{font-size:36px;margin-bottom:8px}
.promo-card .promo-name{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:6px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.promo-card .promo-price{font-size:18px;font-weight:700;color:var(--danger)}
.promo-card .promo-price::before{content:'€';font-size:12px}
.promo-card .promo-old{font-size:11px;color:var(--text-muted);text-decoration:line-through}
.promo-card .promo-old::before{content:'€'}

/* Bottom CTA */
.flyer-cta{padding:0 16px 24px}
.flyer-cta a{display:block;text-align:center;padding:14px;background:var(--accent);color:white;border-radius:var(--radius);font-size:15px;font-weight:600;text-decoration:none}
.flyer-cta a:active{opacity:0.85}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:0.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Responsive ===== */
@media(max-width:768px){body{max-width:100%}}
</style>
</head>
<body>

<!-- Christmas Garland -->
<div class="xmas-garland" id="xmasGarland"></div>

<!-- Top Nav -->
<div class="top-nav">
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <button class="lang-switch" onclick="toggleLang()" id="langSwitchBtn">中/IT</button>
  <div class="top-nav-title">🎄 Volantino Offerte</div>
  <div class="top-nav-actions">
    <button onclick="shareFlyer()">📤</button>
  </div>
</div>

<!-- Flyer Header -->
<div class="flyer-header">
  <h1>Offerte di Natale </h1>
  <p>Sconti incredibili su abbigliamento, detergenti e casa</p>
  <div class="validity">Valido fino al 31 Gennaio 2027</div>
</div>

<!-- Flyer Image -->
<div class="flyer-container">
  <div class="flyer-image-wrapper" id="flyerImageWrapper">
    <div class="flyer-placeholder" id="flyerPlaceholder">
      <div class="fp-icon"></div>
      <p>传单的 PDF / 图片<br>通过商家后台上传后将在此显示<br><br>Il volantino apparirà qui<br>dopo il caricamento dal pannello admin</p>
    </div>
  </div>
</div>

<!-- Promo Grid -->
<div class="promo-grid" id="promoGrid"></div>

<!-- CTA -->
<div class="flyer-cta">
  <a href="index.html"><span data-lang-it>🛒 Vai allo Shopping</span><span data-lang-zh>🛒 去购物</span></a>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Garland =====
(function(){const g=document.getElementById('xmasGarland');for(let i=0;i<60;i++){const s=document.createElement('span');g.appendChild(s)}})();

// ===== Promo Products (from Supabase or fallback) =====
const SB_URL='https://yiyydikfpgbmtdypiggc.supabase.co';
const SB_KEY='sb_publishable_yk7pSAVz4iQ_oFaF0ybUEQ_xd92I2LM';
let sb;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}

const FALLBACK_PROMOS=[
  {id:28,name:'Cappotto in Lana Grigio Chiaro',emoji:'🧥',price:39.90,old_price:69.90,discount:43},
  {id:26,name:'Set Pentole 5pz',emoji:'🍳',price:19.99,old_price:39.99,discount:50},
  {id:25,name:'Detersivo Lavatrice 3L',emoji:'🧴',price:9.00,old_price:18.99,discount:53},
  {id:27,name:'Set Asciugamani 6pz',emoji:'🛁',price:9.00,old_price:24.99,discount:64},
  {id:1,name:'Jeans Slim Vita Alta',emoji:'👖',price:29.90,old_price:59.90,discount:50},
  {id:2,name:'T-shirt Cotone',emoji:'',price:19.90,old_price:35.90,discount:45},
];

async function loadPromos(){
  let promos=FALLBACK_PROMOS;
  if(sb){
    try{
      const{data}=await sb.from('products').select('id,name,emoji,price,old_price,tag').eq('on_sale',true).order('price');
      if(data&&data.length){
        promos=data.filter(p=>p.old_price).map(p=>({id:p.id,name:p.name,emoji:p.emoji||'',price:parseFloat(p.price),old_price:parseFloat(p.old_price),discount:Math.round((1-p.price/p.old_price)*100)}));
      }
    }catch(e){}
  }
  renderPromos(promos);
  // Load flyer image if stored
  loadFlyerImage();
}

function renderPromos(promos){
  const grid=document.getElementById('promoGrid');
  grid.innerHTML=promos.map(p=>`
    <div class="promo-card" onclick="location.href='detail.html?id=${p.id}'">
      <div class="promo-discount">-${p.discount}%</div>
      <div class="promo-emoji">${p.emoji||''}</div>
      <div class="promo-name">${p.name}</div>
      <div class="promo-price">${p.price}</div>
      <div class="promo-old">${p.old_price}</div>
    </div>
  `).join('');
}

async function loadFlyerImage(){
  if(!sb)return;
  try{
    const{data}=await sb.from('site_settings').select('value').eq('key','flyer_image').single();
    if(data&&data.value&&data.value.startsWith('data:')){
      document.getElementById('flyerPlaceholder').style.display='none';
      const img=document.createElement('img');
      img.src=data.value;
      img.alt='Volantino';
      img.style.cssText='width:100%;display:block;cursor:pointer';
      img.onclick=()=>window.open(data.value,'_blank');
      document.getElementById('flyerImageWrapper').appendChild(img);
    }
  }catch(e){}
}

function shareFlyer(){
  if(navigator.share){
    navigator.share({title:'L&Qmercatone Offerte',text:'Guarda le nostre offerte!',url:location.href});
  }else{
    navigator.clipboard.writeText(location.href).then(()=>showToast(' Link copiato!'));
  }
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}


// ===== Language =====
let currentLang=localStorage.getItem('lq_lang')||'it';
if(currentLang==='zh'){document.body.classList.add('lang-zh');document.getElementById('langSwitchBtn').textContent='IT/中'}
function toggleLang(){
  currentLang=currentLang==='it'?'zh':'it';
  localStorage.setItem('lq_lang',currentLang);
  if(currentLang==='zh'){document.body.classList.add('lang-zh');document.getElementById('langSwitchBtn').textContent='IT/中'}
  else{document.body.classList.remove('lang-zh');document.getElementById('langSwitchBtn').textContent='中/IT'}
}

loadPromos();
</script>
</body>
</html>
