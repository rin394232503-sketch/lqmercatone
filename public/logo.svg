<!-- L&Q Mercatone Logo - Horizontal Version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E6A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="12" fill="url(#darkGrad)"/>

  <!-- Decorative border -->
  <rect x="3" y="3" width="394" height="114" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- L&Q Monogram Circle -->
  <circle cx="65" cy="60" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="65" cy="60" r="33" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- L letter -->
  <text x="42" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="url(#goldGrad)">L</text>

  <!-- & symbol -->
  <text x="60" y="67" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad)" opacity="0.8">&amp;</text>

  <!-- Q letter -->
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="url(#goldGrad)">Q</text>

  <!-- Brand Name -->
  <text x="120" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#F5E6A3" letter-spacing="3">L&amp;Q</text>
  <text x="120" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#C9A84C" letter-spacing="5" opacity="0.9">MERCATONE</text>

  <!-- Decorative line -->
  <line x1="120" y1="88" x2="340" y2="88" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Tagline -->
  <text x="120" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#8B7D3C" letter-spacing="2" font-style="italic">La tua bottega italiana</text>

  <!-- Small decorative stars -->
  <text x="355" y="55" font-size="8" fill="url(#goldGrad)" opacity="0.5">✦</text>
  <text x="370" y="75" font-size="6" fill="url(#goldGrad)" opacity="0.3">✦</text>
</svg>
